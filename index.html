<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8590c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="配達ノート">
<title>まごころ配達ノート</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<style>
:root{
  --primary:#e8590c; --primary-dark:#c94e0a; --bg:#f4f1ec; --card:#ffffff;
  --text:#2b2620; --sub:#8a8378; --line:#e7e2da;
  --blue:#2f7dd1; --red:#d64545; --orange:#e08a00; --purple:#7a49c9;
  --green:#1f9d55; --dgreen:#3f9142; --grey:#6f6a63;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.55}
button{font-family:inherit;font-size:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:10px 12px;
  border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary)}
label{display:block;font-weight:600;font-size:13px;color:var(--sub);margin:14px 0 5px}
.note{font-size:12.5px;color:var(--sub)}
[hidden]{display:none !important}

/* ---------- login ---------- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:400px;background:var(--card);border-radius:20px;
  padding:28px 24px 24px;box-shadow:0 6px 30px rgba(60,40,10,.10)}
.logo{font-size:44px;text-align:center}
.login-card h1{font-size:21px;text-align:center;margin-top:6px}
.login-card .sub{text-align:center;color:var(--sub);font-size:13px;margin:4px 0 10px}
.seg{display:flex;background:#efece6;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:8px;font-weight:600;color:var(--sub);font-size:14px}
.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.primary{display:block;width:100%;background:var(--primary);color:#fff;font-weight:700;
  font-size:16px;padding:13px;border-radius:12px;margin-top:20px}
.primary:active{background:var(--primary-dark)}
#mode-note{margin-top:12px;text-align:center}

/* ---------- app frame ---------- */
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  background:var(--bg);position:relative}
header{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
.h-title{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
#mode-badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.25)}
#btn-user{background:rgba(255,255,255,.18);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
main{flex:1;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.view{padding:12px 12px 8px}
.view h2{font-size:17px;margin:4px 2px 10px}

/* ---------- bottom nav ---------- */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 0 7px;font-size:10.5px;color:var(--sub);font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
nav button .ni{font-size:21px;line-height:1.2}
nav button.on{color:var(--primary)}
.nav-badge{position:absolute;top:3px;right:calc(50% - 24px);background:var(--red);color:#fff;
  font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:99px;
  display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ---------- chips / filters ---------- */
.filters{position:sticky;top:52px;z-index:10;background:var(--bg);padding:2px 0 8px;margin:0 -2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:3px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#fff;border:1.5px solid var(--line);border-radius:99px;
  padding:5px 13px;font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}

/* ---------- timeline ---------- */
.timeline{display:flex;flex-direction:column;gap:9px}
.date-sep{text-align:center;margin:10px 0 2px}
.date-sep span{background:#e3ddd2;color:#6f6a63;font-size:11.5px;font-weight:700;
  padding:3px 12px;border-radius:99px}
.card{background:var(--card);border-radius:13px;padding:10px 12px 9px;
  box-shadow:0 1px 3px rgba(60,40,10,.07);border-left:4px solid var(--grey)}
.card-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge-route{font-size:11px;font-weight:800;color:#fff;background:var(--grey);
  border-radius:6px;padding:1.5px 7px}
.badge-cat{font-size:11.5px;font-weight:700}
.card-time{margin-left:auto;font-size:11.5px;color:var(--sub)}
.card-main{margin-top:4px;font-size:14.5px}
.card-main b{font-size:15px}
.card-memo{font-size:13px;color:var(--sub);margin-top:2px;white-space:pre-wrap}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:6px}
.card-author{font-size:12px;color:var(--sub)}
.st{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;margin-left:auto}
.st-open{background:#fdeaea;color:var(--red)}
.st-done{background:#e5f5ec;color:var(--green)}
.retract{font-size:11px;font-weight:700;color:var(--sub);border:1.5px solid var(--line);
  border-radius:99px;padding:1px 10px;background:#fff}
.retract.arm{color:var(--red);border-color:var(--red)}
.empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:13.5px}

/* ---------- compose ---------- */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cat-btn{background:#fff;border-radius:14px;padding:14px 8px;text-align:center;
  box-shadow:0 1px 3px rgba(60,40,10,.07);font-weight:700;font-size:14px;border-top:3px solid var(--grey)}
.cat-btn .ci{display:block;font-size:26px;margin-bottom:3px}
.cat-btn.on{outline:2.5px solid var(--primary);outline-offset:-1px}
#report-form{background:#fff;border-radius:14px;padding:6px 16px 16px;margin-top:12px;
  box-shadow:0 1px 3px rgba(60,40,10,.07)}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--text);
  margin-top:16px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--primary);flex:0 0 auto}
.form-cat-head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15.5px;margin-top:14px}
#btn-back-cat{color:var(--primary);font-weight:700;font-size:13px;margin-left:auto}

/* ---------- todo ---------- */
.todo-card{background:#fff;border-radius:13px;padding:11px 12px;margin-bottom:9px;
  box-shadow:0 1px 3px rgba(60,40,10,.07);display:flex;gap:10px;align-items:flex-start;
  border-left:4px solid var(--red)}
.todo-card.is-done{border-left-color:var(--green);opacity:.75}
.todo-body{flex:1;min-width:0}
.todo-check{flex:0 0 auto;width:64px;padding:9px 0;border-radius:10px;background:var(--primary);
  color:#fff;font-weight:800;font-size:13px;text-align:center}
.todo-check.undo{background:#efece6;color:var(--sub)}
.todo-actions{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.todo-del{width:64px;padding:8px 0;border-radius:10px;background:#fdeaea;color:var(--red);
  font-weight:800;font-size:12px;text-align:center}
.todo-donenote{font-size:11.5px;color:var(--green);font-weight:700;margin-top:4px}

/* ---------- shift ---------- */
.cal-head{display:flex;align-items:center;justify-content:center;gap:14px;margin:2px 0 8px}
.cal-head button{font-size:18px;padding:4px 14px;background:#fff;border-radius:10px;
  box-shadow:0 1px 3px rgba(60,40,10,.08)}
#cal-label{font-weight:800;font-size:16.5px;min-width:120px;text-align:center}
.deadline{font-size:13px;font-weight:800;border-radius:10px;padding:8px 12px;margin:2px 0 8px;text-align:center}
.deadline.ok{background:#e5f5ec;color:var(--green)}
.deadline.warn{background:#fdeaea;color:var(--red)}
.cal-month-title{font-weight:800;font-size:15px;margin:14px 2px 4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal-wd{text-align:center;font-size:11px;font-weight:700;color:var(--sub);padding:2px 0}
.cal-wd.sun{color:var(--red)} .cal-wd.sat{color:var(--blue)}
.cal-cell{aspect-ratio:1/1.15;background:#fff;border-radius:9px;padding:3px 2px;
  display:flex;flex-direction:column;align-items:center;font-size:13px;
  box-shadow:0 1px 2px rgba(60,40,10,.06);position:relative}
.cal-cell.blank{background:transparent;box-shadow:none}
.cal-cell.today .dnum{background:var(--primary);color:#fff;border-radius:99px}
.cal-cell.sel{outline:2.5px solid var(--primary);outline-offset:-1px}
.cal-cell.mysel{background:#e5f5ec;outline:2px solid var(--green);outline-offset:-1px}
.today-btn{display:block;margin:0 auto 8px;font-size:12.5px;font-weight:700;color:var(--primary);
  background:#fff;border-radius:99px;padding:5px 16px;box-shadow:0 1px 3px rgba(60,40,10,.1)}
.dnum{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-weight:700}
.cal-mine{font-size:10px;color:var(--green);font-weight:900;line-height:1}
.cal-cnt{font-size:9.5px;color:var(--sub);font-weight:700;margin-top:auto}
#day-detail{background:#fff;border-radius:14px;padding:14px 16px;margin-top:12px;
  box-shadow:0 1px 3px rgba(60,40,10,.07)}
#day-detail h3{font-size:15px;margin-bottom:6px}
.member-tag{display:inline-block;background:#e5f5ec;color:var(--green);font-weight:700;
  font-size:13px;padding:3px 12px;border-radius:99px;margin:2px 3px 2px 0}

/* ---------- シフト日別一覧（管理者） ---------- */
.daylist{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.daylist-row{background:#fff;border-radius:12px;padding:9px 12px;box-shadow:0 1px 3px rgba(60,40,10,.06);
  display:flex;align-items:flex-start;gap:10px;border-left:4px solid var(--line)}
.daylist-row.has{border-left-color:var(--green)}
.daylist-row.today{outline:2px solid var(--primary);outline-offset:-1px}
.daylist-date{flex:0 0 66px;font-weight:800;font-size:14px;padding-top:2px}
.daylist-date .wd{font-size:11px;font-weight:700;margin-left:2px;color:var(--sub)}
.daylist-date .wd.sun{color:var(--red)} .daylist-date .wd.sat{color:var(--blue)}
.daylist-members{flex:1;min-width:0}
.daylist-cnt{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--green);padding-top:3px}
.daylist-cnt.zero{color:var(--sub)}

/* ---------- 検索 ---------- */
.search-wrap{position:relative;margin:0 0 6px}
.search-wrap input{padding:9px 34px 9px 34px;font-size:15px;border-radius:99px;background:#fff}
.search-wrap .s-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:15px}
.search-wrap .s-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  color:var(--sub);font-size:18px;padding:2px 8px;display:none}
.search-wrap.active .s-clear{display:block}
.search-count{font-size:12px;color:var(--sub);font-weight:600;margin:0 2px 6px}
.adv-bar{display:flex;align-items:center;gap:8px;margin:2px 0 4px}
.adv-bar #adv-btn{font-size:12.5px;font-weight:700;color:var(--sub);background:#fff;
  border:1.5px solid var(--line);border-radius:99px;padding:5px 12px}
.adv-bar #adv-btn.on{color:var(--primary);border-color:var(--primary)}
.adv-bar #adv-clear{font-size:12px;font-weight:700;color:var(--red);
  border:1.5px solid var(--red);border-radius:99px;padding:4px 11px;margin-left:auto}
#adv-panel{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:4px 12px 12px;margin:2px 0 6px}
.adv-row{margin-top:10px}
.adv-row>label{margin:0 0 5px}
.adv-date{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.adv-date .chip{flex:0 0 auto}
.adv-date input[type=date]{flex:1;min-width:130px}

/* ---------- お知らせ掲示 ---------- */
.ann-area{margin:0 0 10px}
.ann{background:#fff7ef;border:1.5px solid #f3d9bd;border-radius:12px;padding:9px 12px;
  display:flex;gap:9px;align-items:flex-start;margin-bottom:7px}
.ann-ico{font-size:17px;line-height:1.3}
.ann-body{flex:1;min-width:0}
.ann-text{font-size:14px;font-weight:700;color:var(--text);white-space:pre-wrap}
.ann-meta{font-size:11.5px;color:var(--sub);margin-top:2px}
.ann-del{flex:0 0 auto;font-size:16px;font-weight:800;color:var(--sub);padding:0 4px;line-height:1}
.ann-post{display:flex;gap:6px;margin-top:2px}
.ann-post input{flex:1}
.ann-post button{flex:0 0 auto;background:var(--primary);color:#fff;font-weight:700;
  border-radius:10px;padding:0 14px;font-size:13.5px;white-space:nowrap}

/* ---------- 書き出しバー ---------- */
.export-bar{margin:0 0 10px}
.export-bar button{width:100%;background:#eef6ef;color:var(--green);border:1.5px solid #bfe3cb;
  border-radius:10px;padding:9px;font-size:13px;font-weight:800}
.export-bar button:active{background:#e0efe4}

/* ---------- 報告へのコメント ---------- */
.comment-btn{font-size:11.5px;font-weight:700;color:var(--sub);border:1.5px solid var(--line);
  border-radius:99px;padding:2px 10px;background:#fff}
.comment-btn.has{color:var(--blue);border-color:#bcd6f0;background:#f0f6fd}
.comment-thread{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.comment{font-size:13px;color:var(--text);background:#f7f5f1;border-radius:9px;
  padding:6px 10px;margin-bottom:5px}
.comment .c-author{font-weight:800;color:var(--blue);margin-right:6px}
.comment .c-time{font-size:10.5px;color:var(--sub);margin-left:6px}
.comment-input{display:flex;gap:6px;margin-top:4px}
.comment-input input{flex:1;font-size:15px;padding:8px 10px}
.comment-input .c-send{flex:0 0 auto;background:var(--blue);color:#fff;font-weight:700;
  border-radius:9px;padding:0 14px;font-size:13.5px}

/* ---------- タイムカード（打刻） ---------- */
.tc-card{background:#fff;border-radius:16px;padding:18px 16px;box-shadow:0 2px 8px rgba(60,40,10,.08);
  text-align:center;margin-bottom:14px}
.tc-date{font-size:13px;color:var(--sub);font-weight:700}
.tc-status{font-size:20px;font-weight:800;margin:8px 0 4px}
.tc-status.working{color:var(--green)} .tc-status.done{color:var(--sub)} .tc-status.none{color:var(--text)}
.tc-times{font-size:14px;color:var(--sub);font-weight:600;margin-bottom:4px}
.tc-worked{font-size:14px;font-weight:800;color:var(--primary)}
.tc-btns{display:flex;gap:10px;margin-top:14px}
.tc-btn{flex:1;padding:16px 0;border-radius:14px;font-weight:800;font-size:17px;color:#fff}
.tc-in{background:var(--green)} .tc-in:active{background:#178047}
.tc-out{background:var(--primary)} .tc-out:active{background:var(--primary-dark)}
.tc-btn:disabled{background:#e2ddd4;color:#a9a297}
.tc-total{background:#fff7ef;border:1.5px solid #f3d9bd;border-radius:12px;padding:11px 14px;
  display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tc-total .lbl{font-size:13px;font-weight:700;color:var(--sub)}
.tc-total .val{font-size:18px;font-weight:900;color:var(--primary)}
.tc-hist{display:flex;flex-direction:column;gap:6px}
.tc-hist-row{background:#fff;border-radius:10px;padding:8px 12px;box-shadow:0 1px 2px rgba(60,40,10,.06);
  display:flex;align-items:center;font-size:13.5px}
.tc-hist-row .d{font-weight:700;flex:0 0 76px}
.tc-hist-row .t{color:var(--sub);flex:1}
.tc-hist-row .w{font-weight:800;color:var(--primary)}
.tc-person{background:#fff;border-radius:12px;padding:10px 13px;margin-bottom:8px;box-shadow:0 1px 3px rgba(60,40,10,.06)}
.tc-person-head{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:15px}
.tc-person-total{color:var(--primary);font-size:14px;font-weight:900}
.tc-person-days{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.7}

/* ---------- 写真 ---------- */
.card-photo{display:block;max-width:170px;max-height:170px;border-radius:10px;margin-top:7px;
  border:1px solid var(--line)}
#photo-preview{margin-top:8px;display:flex;align-items:flex-start;gap:10px}
#photo-preview img{max-width:110px;max-height:110px;border-radius:10px;border:1px solid var(--line)}
#photo-remove{font-size:12px;font-weight:700;color:var(--red);border:1.5px solid var(--red);
  border-radius:99px;padding:3px 12px}
input[type=file]{padding:8px;background:#faf8f5}
#photo-viewer{position:fixed;inset:0;background:rgba(15,12,8,.93);z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px}
#photo-viewer img{max-width:100%;max-height:85vh;border-radius:8px}
#photo-viewer .close-hint{color:#ccc;font-size:12.5px;font-weight:600}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
  background:rgba(43,38,32,.92);color:#fff;font-size:13.5px;font-weight:600;
  padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;
  transition:all .25s;z-index:99;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ========== ログイン ========== -->
<div id="login">
  <div class="login-card">
    <div class="logo">🍱</div>
    <h1>まごころ配達ノート</h1>
    <p class="sub">配達報告・要対応・シフトをひとつに</p>
    <div class="seg" id="login-tab" style="margin-top:16px">
      <button type="button" data-v="login" class="on">ログイン</button>
      <button type="button" data-v="register">新規登録</button>
    </div>
    <label>お名前</label>
    <input id="login-name" maxlength="12" autocomplete="off">
    <label>暗証番号（4〜8桁の数字）</label>
    <input id="login-pw" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    <div id="reg-wrap" hidden>
      <label>役割</label>
      <div class="seg" id="login-role">
        <button type="button" data-v="staff" class="on">配達員</button>
        <button type="button" data-v="admin">管理者</button>
      </div>
      <div id="admin-pin-wrap" hidden>
        <label>管理者コード</label>
        <input id="login-pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
      </div>
    </div>
    <label>担当ルート（今日の担当）</label>
    <div class="seg" id="login-route">
      <button type="button" data-v="1" class="on">1</button>
      <button type="button" data-v="2">2</button>
      <button type="button" data-v="3">3</button>
      <button type="button" data-v="4">4</button>
      <button type="button" data-v="厨房">厨房</button>
    </div>
    <button id="login-go" class="primary">ログイン</button>
    <p id="mode-note" class="note"></p>
  </div>
</div>

<!-- ========== アプリ本体 ========== -->
<div id="app" hidden>
  <header>
    <div class="h-title">🍱 まごころ配達ノート <span id="mode-badge"></span></div>
    <button id="btn-user" title="名前・ルートを変更"></button>
  </header>
  <main>

    <section id="view-timeline" class="view">
      <div class="filters">
        <div class="search-wrap" id="search-wrap">
          <span class="s-ico">🔍</span>
          <input id="search-input" type="search" placeholder="お客様名・内容・名前で検索" autocomplete="off">
          <button class="s-clear" id="search-clear" aria-label="クリア">✕</button>

function hashPin(name,pin){
  let h=5381; const s=name+'::'+pin+'::mgk2026';
  for(const c of s){ h=(Math.imul(h,33)^c.codePointAt(0))>>>0; }
  return 'h'+h.toString(36);
}

class DemoStore{
  constructor(){ this.reports=seedReports(); this.shifts=seedShifts(); this.accounts={};
    this.images={}; this.timecards=seedTimecards(); this.comments=seedComments();
    this.announcements=seedAnnouncements(); this._id=0; this._imgId=0; this._cId=0; this._aId=0; }

  deleteImage(id){ delete this.images[id]; }
  async init(onReports,onShifts,onTimecards,onComments,onAnnouncements){
    this.onR=onReports; this.onS=onShifts; this.onT=onTimecards; this.onC=onComments; this.onA=onAnnouncements;
    onReports(this.reports); onShifts(this.shifts); onTimecards(this.timecards);
    onComments(this.comments); onAnnouncements(this.announcements); }
  setPunch(date,name,patch){ const d=this.timecards[date]||(this.timecards[date]={});
    d[name]=Object.assign({}, d[name], patch); this.onT(this.timecards); }
  addComment(reportId,c){ c.id='c'+(++this._cId);
    (this.comments[reportId]=this.comments[reportId]||[]).push(c); this.onC(this.comments); }
  addAnnouncement(a){ a.id='a'+(++this._aId); this.announcements.push(a); this.onA(this.announcements); }
  deleteAnnouncement(id){ this.announcements=this.announcements.filter(x=>x.id!==id); this.onA(this.announcements); }
  async getAccount(name){ return this.accounts[name]||null; }

    if(this.accounts[a.name]) throw new Error('その名前はすでに登録されています');
    this.accounts[a.name]=a; }
  addReport(r){ r.id='d'+(++this._id); this.reports.push(r); this.onR(this.reports); }
  updateReport(id,patch){ const r=this.reports.find(x=>x.id===id);
    if(r){ Object.assign(r,patch); this.onR(this.reports); } }
  deleteReport(id){ this.reports=this.reports.filter(x=>x.id!==id); this.onR(this.reports); }
  setShift(date,name,val){ const d=this.shifts[date]||(this.shifts[date]={});
    if(val) d[name]=true; else delete d[name]; this.onS(this.shifts); }
}

function loadScript(src){ return new Promise((res,rej)=>{
  const s=document.createElement('script'); s.src=src; s.onload=res;
  s.onerror=()=>rej(new Error('読み込み失敗: '+src)); document.head.appendChild(s); }); }

class FirebaseStore{
  async init(onReports,onShifts,onTimecards,onComments,onAnnouncements){
    const V='10.12.2';
    await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
    await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`);
    firebase.initializeApp(FIREBASE_CONFIG);
    this.db = firebase.firestore();
    this.db.collection('reports').orderBy('ts','asc').limitToLast(400)
      .onSnapshot(snap=>{ onReports(snap.docs.map(d=>({id:d.id, ...d.data()}))); },
        err=>toast('通信エラー：'+err.message));
    this.db.collection('shifts')
      .onSnapshot(snap=>{ const m={};
        snap.docs.forEach(d=>{ const v=d.data();
          if(v.available){ (m[v.date]=m[v.date]||{})[v.name]=true; } });
        onShifts(m); }, err=>toast('通信エラー：'+err.message));
    this.db.collection('timecards')
      .onSnapshot(snap=>{ const m={};
        snap.docs.forEach(d=>{ const v=d.data();
          (m[v.date]=m[v.date]||{})[v.name]={inTime:v.inTime||0, outTime:v.outTime||0}; });
        onTimecards(m); }, err=>toast('通信エラー：'+err.message));
    this.db.collection('comments').orderBy('ts','asc').limitToLast(1000)
      .onSnapshot(snap=>{ const m={};
        snap.docs.forEach(d=>{ const v=d.data();
          (m[v.reportId]=m[v.reportId]||[]).push({id:d.id, ...v}); });
        onComments(m); }, err=>toast('通信エラー：'+err.message));
    this.db.collection('announcements').orderBy('ts','asc').limitToLast(50)
      .onSnapshot(snap=>{ onAnnouncements(snap.docs.map(d=>({id:d.id, ...d.data()}))); },
        err=>toast('通信エラー：'+err.message));
  }
  addComment(reportId,c){ this.db.collection('comments').add(Object.assign({reportId},c))
    .catch(e=>toast('コメント送信エラー：'+e.message)); }
  addAnnouncement(a){ this.db.collection('announcements').add(a)
    .catch(e=>toast('お知らせ送信エラー：'+e.message)); }
  deleteAnnouncement(id){ this.db.collection('announcements').doc(id).delete()
    .catch(e=>toast('削除エラー：'+e.message)); }
  setPunch(date,name,patch){ const ref=this.db.collection('timecards').doc(date+'_'+name);
    ref.set(Object.assign({date,name}, patch), {merge:true})
      .catch(e=>toast('打刻エラー：'+e.message)); }
  addReport(r){ this.db.collection('reports').add(r).catch(e=>toast('送信エラー：'+e.message)); }
  updateReport(id,patch){ this.db.collection('reports').doc(id).update(patch)
    .catch(e=>toast('更新エラー：'+e.message)); }
  deleteReport(id){ this.db.collection('reports').doc(id).delete()
    .catch(e=>toast('削除エラー：'+e.message)); }
  async addImage(data){
    const ref=await this.db.collection('images').add({data, ts:Date.now()});
    return ref.id; }
  async getImage(id){
    const d=await this.db.collection('images').doc(id).get();
    return d.exists ? d.data().data : null; }
  deleteImage(id){ this.db.collection('images').doc(id).delete().catch(()=>{}); }
  async getAccount(name){
    const d=await this.db.collection('accounts').doc(name).get();
    return d.exists ? d.data() : null; }
  async createAccount(a){
    const ref=this.db.collection('accounts').doc(a.name);
    const d=await ref.get();
    if(d.exists) throw new Error('その名前はすでに登録されています');
    await ref.set(a); }
  setShift(date,name,val){ const ref=this.db.collection('shifts').doc(date+'_'+name);
    (val ? ref.set({date,name,available:true}) : ref.delete())
      .catch(e=>toast('更新エラー：'+e.message)); }
}

const store = MODE==='online' ? new FirebaseStore() : new DemoStore();
</script>

/* ---------------- CSV書き出し ---------------- */
function csvCell(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
function todayStamp(){ const d=new Date();
  return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate()); }
function downloadCSV(filename, rows){
  const csv='﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function filteredReports(){
  const q=state.fSearch.trim().toLowerCase();
  return state.reports.filter(r=>
    (state.fRoute==='all'  || r.route===state.fRoute) &&
    (state.fCat==='all'    || r.cat===state.fCat) &&
    (state.fPerson==='all' || r.author===state.fPerson) &&
    (!state.fDate          || dateKey(r.ts)===state.fDate) &&
    (!q || [r.customer,r.detail,r.memo,r.author,routeLabel(r.route),(CATS[r.cat]||{}).label]
            .join(' ').toLowerCase().includes(q)));
}
function exportReportsCSV(){
  const rows=[['日付','時刻','ルート','種類','お客様','内容','メモ','報告者','要対応','処理状況','処理者']];
  for(const r of filteredReports())
    rows.push([dateKey(r.ts), fmtTime(r.ts), routeLabel(r.route), (CATS[r.cat]||{}).label||r.cat,
      r.customer||'', r.detail||'', r.memo||'', r.author,
      r.needsAction?'要対応':'', r.needsAction?(r.done?'処理済み':'未処理'):'', r.done?(r.doneBy||''):'']);
  downloadCSV(`報告_${todayStamp()}.csv`, rows);
  toast('報告をCSVに書き出しました');
}
function exportTimecardsCSV(){
  const rows=[['名前','日付','出勤','退勤','勤務時間(分)','勤務時間']];
  const names=new Set();
  for(const k of tcPeriodDates()) for(const n of Object.keys(state.timecards[k]||{})) names.add(n);
  for(const n of [...names].sort()){
    let totMin=0;
    for(const k of tcPeriodDates()){
      const r=(state.timecards[k]||{})[n]; if(!r||!r.inTime) continue;
      const mm=workedMin(r); totMin+=mm;
      rows.push([n, k, fmtTime(r.inTime), r.outTime?fmtTime(r.outTime):'', mm||'', mm?fmtDur(mm):'']);
    }
    rows.push([n, '（'+tcPeriodInfo().label+' 合計）', '', '', totMin, fmtDur(totMin)]);
  }
  downloadCSV(`勤怠_${tcPeriodInfo().label.replace(/[ 〜\/]/g,'')}.csv`, rows);
  toast('勤怠をCSVに書き出しました');
}
function exportShiftsCSV(){
  const rows=[['日付','曜日','人数','出勤できる人']];
  for(const key of periodDates()){
    const [yy,mm,dd]=key.split('-').map(Number);
    const wd=WDAYS[new Date(yy,mm-1,dd).getDay()];
    const members=Object.keys(state.shifts[key]||{});
    rows.push([key, wd, members.length, members.join('、')]);
  }
  downloadCSV(`シフト_${periodInfo().label.replace(/[ 〜\/]/g,'')}.csv`, rows);
  toast('シフトをCSVに書き出しました');
}

function renderTimeline(){
  const el=$('#timeline');

  buildPersonOptions(); updateAdvUI();
  const list = filteredReports();
  // 絞り込み中の表示（キーワード・人・日付のいずれか）
  const parts=[];
  if(q) parts.push(`「${state.fSearch.trim()}」`);
  if(state.fPerson!=='all') parts.push(`${state.fPerson}さん`);
  if(state.fDate){ const [ ,mm,dd]=state.fDate.split('-').map(Number); parts.push(`${mm}月${dd}日`); }
  const scEl=$('#search-count');
  if(parts.length){ scEl.hidden=false; scEl.textContent=`${parts.join(' / ')} で絞り込み中：${list.length}件`; }
  else scEl.hidden=true;

  const topHTML = announcementsHTML()
    + (isAdmin() && list.length ? `<div class="export-bar"><button id="export-reports">📥 表示中の報告をCSVで書き出し（${list.length}件）</button></div>` : '');

      ? '<div class="empty">条件に合う報告が見つかりませんでした。<br>絞り込みを変えて試してみてください。</div>'
      : '<div class="empty">まだ報告がありません。<br>「➕ 報告する」から送ってみてください。</div>');
    attachAnnHandlers(el);
    return;

  attachCommentHandlers(el);

    if(!b.dataset.arm){

      setTimeout(()=>{ if(b.isConnected){ delete b.dataset.arm; b.textContent='取消'; b.classList.remove('arm'); } },3000);
      return;

    if(rep && rep.photoId) store.deleteImage(rep.photoId);
    toast('送信を取り消しました');

/* ---------------- シフトカレンダー（21日〜翌月20日の期間制） ---------------- */
function periodInfo(){
  const {y,m}=state.period;
  const ny = m===11 ? y+1 : y, nm = (m+1)%12;
  return { y, m, ny, nm,
    label:`${m+1}/21 〜 ${nm+1}/20 分`,
    deadline:new Date(y,m,8) };
}
function periodDates(){
  const p=periodInfo(); const out=[];
  const lastDay=new Date(p.y,p.m+1,0).getDate();
  for(let d=21;d<=lastDay;d++) out.push(`${p.y}-${pad2(p.m+1)}-${pad2(d)}`);
  for(let d=1;d<=20;d++) out.push(`${p.ny}-${pad2(p.nm+1)}-${pad2(d)}`);
  return out;
}
function myCurrentDates(){
  return periodDates().filter(k=>(state.shifts[k]||{})[state.user.name]);
}
/* 期間が変わったら、選択状態を「自分の提出済みの日」で初期化 */
function ensureShiftSel(){
  const pk=state.period.y+'-'+state.period.m+'-'+state.user.name;
  if(state.shiftSelPeriod!==pk){
    state.shiftSelPeriod=pk;
    state.shiftSel=new Set(myCurrentDates());
  }
}
const adminView = () => isAdmin() && state.shiftMode==='view';

function monthGridHTML(y,m,from,to){
  const todayK=dateKey(Date.now());
  const av=adminView();
  let html=`<div class="cal-month-title">${y}年${m+1}月</div><div class="cal-grid">`;
  html+=WDAYS.map((w,i)=>`<div class="cal-wd${i===0?' sun':i===6?' sat':''}">${w}</div>`).join('');
  const off=new Date(y,m,from).getDay();
  for(let i=0;i<off;i++) html+='<div class="cal-cell blank"></div>';
  for(let d=from;d<=to;d++){
    const key=`${y}-${pad2(m+1)}-${pad2(d)}`;
    const cnt=Object.keys(state.shifts[key]||{}).length;
    const selected=state.shiftSel && state.shiftSel.has(key);
    const cls=(key===todayK?' today':'')
      +(av && key===state.selDate?' sel':'')
      +(!av && selected?' mysel':'');
    html+=`<button class="cal-cell${cls}" data-key="${key}">
      <span class="dnum">${d}</span>
      ${!av && selected?'<span class="cal-mine">出勤◯</span>':''}
      ${av && cnt?`<span class="cal-cnt">${cnt}人</span>`:''}
    </button>`;
  }
  return html+'</div>';
}

function renderShift(){
  ensureShiftSel();
  const p=periodInfo();
  $('#cal-label').textContent=p.label;
  const today=new Date(); today.setHours(0,0,0,0);
  const diff=Math.round((p.deadline-today)/86400000);
  const dlText=`${p.deadline.getMonth()+1}月8日`;
  const note=$('#deadline-note');
  if(diff>0){ note.textContent=`⏰ 提出締切：${dlText}（あと${diff}日）`; note.className='deadline ok'; }
  else if(diff===0){ note.textContent=`⏰ 提出締切：${dlText}（今日まで！）`; note.className='deadline warn'; }
  else{ note.textContent=`⏰ 提出締切：${dlText}（締切を過ぎています。追加・変更はお早めに）`; note.className='deadline warn'; }
  const av=adminView();
  $('#shift-help').textContent = av
    ? '提出されたシフトを1日ずつ並べています。各日に出勤できる人が一目で分かります。'
    : '出勤できる日をタップして選択（複数OK）→ 最後に「送信して保存」を押してください。毎月8日までに「21日〜翌月20日」の分を提出します。';
  if(av){
    // 管理者：1日単位の一覧
    const todayK=dateKey(Date.now());
    let html='<div class="export-bar"><button id="export-shifts">📥 このシフトをCSVで書き出し</button></div><div class="daylist">';
    for(const key of periodDates()){
      const [yy,mm,dd]=key.split('-').map(Number);
      const wd=WDAYS[new Date(yy,mm-1,dd).getDay()];
      const g=new Date(yy,mm-1,dd).getDay();
      const members=Object.keys(state.shifts[key]||{});
      html+=`<div class="daylist-row${members.length?' has':''}${key===todayK?' today':''}">
        <div class="daylist-date">${mm}/${dd}<span class="wd${g===0?' sun':g===6?' sat':''}">${wd}</span></div>
        <div class="daylist-members">${members.length
          ? members.map(n=>`<span class="member-tag">${esc(n)}</span>`).join('')
          : '<span class="note">提出なし</span>'}</div>
        <div class="daylist-cnt${members.length?'':' zero'}">${members.length}人</div>
      </div>`;
    }
    $('#cal-container').innerHTML = html+'</div>';
    const es=$('#export-shifts'); if(es) es.onclick=exportShiftsCSV;
  }else{
    const lastDay=new Date(p.y,p.m+1,0).getDate();
    $('#cal-container').innerHTML =
      monthGridHTML(p.y,p.m,21,lastDay) + monthGridHTML(p.ny,p.nm,1,20);
    $('#cal-container').querySelectorAll('.cal-cell:not(.blank)').forEach(c=>c.onclick=()=>{
      const key=c.dataset.key;
      state.shiftSel.has(key) ? state.shiftSel.delete(key) : state.shiftSel.add(key);
      renderShift();
    });
  }
  $('#shift-submit-bar').hidden=av;
  if(!av) $('#shift-sel-count').textContent=`選択中：${state.shiftSel.size}日（出勤できる日）`;
  $('#day-detail').hidden=true;
}

function sendShift(){
  ensureShiftSel();
  const cur=new Set(myCurrentDates());
  let changed=0;
  for(const k of state.shiftSel) if(!cur.has(k)){ store.setShift(k,state.user.name,true); changed++; }
  for(const k of cur) if(!state.shiftSel.has(k)){ store.setShift(k,state.user.name,false); changed++; }
  toast(changed ? `シフトを送信しました（出勤可 ${state.shiftSel.size}日）` : '変更はありません');
}

<script>
/* ---------------- タイムカード（打刻・集計は21日〜翌月20日） ---------------- */

  const {y,m,ny,nm}=tcPeriodInfo(); const out=[];
  const lastDay=new Date(y,m+1,0).getDate();
  for(let d=21;d<=lastDay;d++) out.push(`${y}-${pad2(m+1)}-${pad2(d)}`);
  for(let d=1;d<=20;d++) out.push(`${ny}-${pad2(nm+1)}-${pad2(d)}`);
  return out;
}
function workedMin(rec){
  if(!rec || !rec.inTime || !rec.outTime) return 0;
  const m=Math.round((rec.outTime-rec.inTime)/60000);
  return m>0 ? m : 0;
}
function fmtDur(min){
  if(!min) return '0分';
  const h=Math.floor(min/60), m=min%60;
  return (h?`${h}時間`:'')+(m?`${m}分`:(h?'':'0分'));
}
function periodTotalFor(name){
  let sum=0; for(const k of tcPeriodDates()) sum+=workedMin((state.timecards[k]||{})[name]);
  return sum;
}

function renderTimecard(){
  const admin=isAdmin();
  $('#tc-mode').hidden=!admin;
  const showAll = admin && state.tcMode==='all';
  $('#tc-me').hidden=showAll;
  $('#tc-all').hidden=!showAll;
  if(showAll) renderTimecardAll(); else renderTimecardMe();
}

function renderTimecardMe(){
  const name=state.user.name;
  const todayK=dateKey(Date.now());
  const rec=(state.timecards[todayK]||{})[name]||{};
  const hasIn=!!rec.inTime, hasOut=!!rec.outTime;
  let statusCls, statusTxt, times='';
  if(!hasIn){ statusCls='none'; statusTxt='まだ出勤していません'; }
  else if(!hasOut){ statusCls='working'; statusTxt='🟢 勤務中'; times=`出勤 ${fmtTime(rec.inTime)}`; }
  else{ statusCls='done'; statusTxt='退勤済み・お疲れさまでした';
    times=`出勤 ${fmtTime(rec.inTime)} 〜 退勤 ${fmtTime(rec.outTime)}`; }
  const worked = hasOut ? `<div class="tc-worked">本日の勤務：${fmtDur(workedMin(rec))}</div>` : '';
  $('#tc-me').innerHTML = `
    <div class="tc-card">
      <div class="tc-date">${fmtDateLabel(todayK)}</div>
      <div class="tc-status ${statusCls}">${statusTxt}</div>
      ${times?`<div class="tc-times">${times}</div>`:''}
      ${worked}
      <div class="tc-btns">
        <button class="tc-btn tc-in" id="btn-punch-in" ${hasIn?'disabled':''}>出勤</button>
        <button class="tc-btn tc-out" id="btn-punch-out" ${(!hasIn||hasOut)?'disabled':''}>退勤</button>
      </div>
    </div>
    <div class="tc-total">
      <span class="lbl">この期間の合計（${tcPeriodInfo().label}）</span>
      <span class="val">${fmtDur(periodTotalFor(name))}</span>
    </div>
    <div class="tc-hist" id="tc-hist"></div>`;
  const rows=[];
  for(const k of tcPeriodDates()){
    const r=(state.timecards[k]||{})[name];
    if(r&&r.inTime){ const p=k.split('-').map(Number);
      rows.push(`<div class="tc-hist-row">
        <span class="d">${p[1]}/${p[2]}</span>
        <span class="t">${fmtTime(r.inTime)}〜${r.outTime?fmtTime(r.outTime):'（勤務中）'}</span>
        <span class="w">${r.outTime?fmtDur(workedMin(r)):''}</span></div>`);
    }
  }
  $('#tc-hist').innerHTML = rows.length ? rows.reverse().join('')
    : '<div class="note" style="text-align:center;padding:10px">この期間の打刻はまだありません</div>';
  $('#btn-punch-in').onclick=()=>{ store.setPunch(todayK,name,{inTime:Date.now(),outTime:0});
    toast('出勤しました。いってらっしゃい！'); };
  $('#btn-punch-out').onclick=()=>{ store.setPunch(todayK,name,{outTime:Date.now()});
    toast('退勤しました。お疲れさまでした！'); };
}

function renderTimecardAll(){
  $('#tc-label').textContent=tcPeriodInfo().label+' 分';
  const names=new Set();
  for(const k of tcPeriodDates()) for(const n of Object.keys(state.timecards[k]||{})) names.add(n);
  const body=$('#tc-all-body');
  if(!names.size){ body.innerHTML='<div class="empty">この期間の打刻はまだありません</div>'; return; }
  let html='<div class="export-bar"><button id="export-timecards">📥 この期間の勤怠をCSVで書き出し</button></div>';
  for(const n of [...names].sort()){
    let days='';
    for(const k of tcPeriodDates()){
      const r=(state.timecards[k]||{})[n];
      if(r&&r.inTime){ const p=k.split('-').map(Number);
        days+=`${p[1]}/${p[2]} ${fmtTime(r.inTime)}〜${r.outTime?fmtTime(r.outTime):'勤務中'}${r.outTime?`（${fmtDur(workedMin(r))}）`:''}<br>`; }
    }
    html+=`<div class="tc-person">
      <div class="tc-person-head"><span>👤 ${esc(n)}</span>
        <span class="tc-person-total">合計 ${fmtDur(periodTotalFor(n))}</span></div>
      <div class="tc-person-days">${days||'<span class="note">打刻なし</span>'}</div></div>`;
  }
  body.innerHTML=html;
  const et=$('#export-timecards'); if(et) et.onclick=exportTimecardsCSV;
}
</script>
<script>
/* ---------------- 報告フォーム ---------------- */
const FORM_DEFS = {
  absent:{ customer:true,
    selects:[{id:'f-d1',label:'対応',opts:['保冷箱対応','持ち戻り','再配達します']}],
    memoPh:'例：施錠・声かけしたが応答なし　など' },
  cancel:{ customer:true,
    selects:[{id:'f-d1',label:'期間',opts:['明日のみキャンセル','指定日のみキャンセル','本日で終了','来週から中止','しばらく中止']},
             {id:'f-d2',label:'対象',opts:['昼夜','昼のみ','夜のみ']}],
    date:true,
    memoPh:'例：明日お金を払いたいとのこと　など' },
  change:{ customer:true,
    text:{id:'f-d1',label:'変更・依頼の内容',ph:'例：来週月曜は帰りが遅いので保冷箱でお願いしたい'},
    memoPh:'補足があれば' },
  money:{ customer:true,
    selects:[{id:'f-d1',label:'状況',opts:['集金済み（消し込み済み）','集金済み（未消し込み）','お客様が支払い希望','請求書渡し済み','QR送信お願いします']}],
    memoPh:'補足があれば' },
  trial:{ customer:true,
    selects:[{id:'f-d1',label:'ナビ',opts:['ナビ通りでOK','ナビと違う（メモに記入）']},
             {id:'f-d2',label:'表札',opts:['表札あり','表札なし']}],
    memoPh:'在宅時間・今後の予定など' },
  done:{ customer:false, memoPh:'補足があれば（例：このあと給油に行きます）' },
  other:{ customer:false,
    text:{id:'f-d1',label:'件名',ph:'例：弁当が足りない／オイルランプ点灯'},
    memoPh:'詳しい内容（何個足りない・どの車両など）', memoReq:true },
};

function buildCatGrid(){
  $('#cat-grid').innerHTML = Object.entries(CATS).map(([k,c])=>
    `<button type="button" class="cat-btn${state.composeCat===k?' on':''}" data-v="${k}"
       style="border-top-color:${c.color}"><span class="ci">${c.icon}</span>${c.label}</button>`).join('');
  $$('#cat-grid .cat-btn').forEach(b=>b.onclick=()=>selectCat(b.dataset.v));
}

function selectCat(cat){
  state.composeCat=cat; buildCatGrid();
  const def=FORM_DEFS[cat], c=CATS[cat];
  $('#form-cat-label').textContent=c.icon+' '+c.label;
  let html=`<label>ルート</label><select id="f-route">${
    ROUTES.map(r=>`<option value="${r}"${r===state.user.route?' selected':''}>${routeLabel(r)}</option>`).join('')}</select>`;
  if(def.customer) html+=`<label>お客様のお名前</label><input id="f-customer" autocomplete="off">`;
  (def.selects||[]).forEach(s=>{
    html+=`<label>${s.label}</label><select id="${s.id}">${s.opts.map(o=>`<option>${o}</option>`).join('')}</select>`; });
  if(def.date) html+=`<label>対象日・開始日（わかれば）</label><input type="date" id="f-date">`;
  if(def.text) html+=`<label>${def.text.label}</label><input id="${def.text.id}" placeholder="${def.text.ph}" autocomplete="off">`;
  html+=`<label>メモ${def.memoReq?'':'（任意）'}</label><textarea id="f-memo" rows="2" placeholder="${def.memoPh}"></textarea>`;
  html+=`<label>写真（任意）</label><input type="file" id="f-photo" accept="image/*">
    <div id="photo-preview" hidden></div>`;
  $('#form-fields').innerHTML=html;
  state.pendingPhoto=null;
  $('#f-photo').onchange=async e=>{
    const f=e.target.files && e.target.files[0];
    if(!f) return;
    try{
      state.pendingPhoto=await processPhoto(f);
      const pv=$('#photo-preview');
      pv.hidden=false;
      pv.innerHTML=`<img src="${state.pendingPhoto.thumb}" alt="プレビュー">
        <button type="button" id="photo-remove">✕ 削除</button>`;
      $('#photo-remove').onclick=()=>{ state.pendingPhoto=null; pv.hidden=true; pv.innerHTML=''; $('#f-photo').value=''; };
    }catch(err){ toast('画像を読み込めませんでした'); $('#f-photo').value=''; }
  };
  $('#form-action-note').textContent = cat==='done'
    ? '' : '※ この報告は自動で「要対応リスト」に入ります';
  $('#report-form').hidden=false;
  $('#report-form').scrollIntoView({behavior:'smooth',block:'start'});
}

function fmtJPDate(v){ if(!v) return ''; const [y,m,d]=v.split('-'); return Number(m)+'/'+Number(d); }

/* 写真をスマホでも軽い形に自動圧縮（サムネ＋拡大用） */
async function processPhoto(file){
  const url=URL.createObjectURL(file);
  const img=new Image();
  await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
  const make=(maxW,q)=>{
    const sc=Math.min(1, maxW/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(img.width*sc));
    c.height=Math.max(1,Math.round(img.height*sc));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',q);
  };
  let full=make(1080,.6);
  if(full.length>700000) full=make(800,.5);
  if(full.length>700000) full=make(640,.4);
  const thumb=make(240,.6);
  URL.revokeObjectURL(url);
  return {thumb, full};
}

async function submitReport(e){
  e.preventDefault();
  const cat=state.composeCat; if(!cat) return;
  const def=FORM_DEFS[cat];
  const val=id=>{ const el=document.getElementById(id); return el?el.value.trim():''; };
  const customer=val('f-customer');
  if(def.customer && !customer){ toast('お客様のお名前を入力してください'); return; }
  if(def.text && def.memoReq===undefined && cat==='change' && !val('f-d1')){ toast('変更・依頼の内容を入力してください'); return; }
  if(cat==='other' && !val('f-d1')){ toast('件名を入力してください'); return; }
  const memo=val('f-memo');
  if(def.memoReq && !memo){ toast('内容を入力してください'); return; }
  let detail='';
  if(cat==='absent') detail=val('f-d1');
  else if(cat==='cancel'){
    detail=val('f-d1'); const d=fmtJPDate(val('f-date'));
    if(d) detail+=`（${d}〜）`; detail+=`（${val('f-d2')}）`;
  }
  else if(cat==='change') detail=val('f-d1');
  else if(cat==='money') detail=val('f-d1');
  else if(cat==='trial') detail=val('f-d1')+'／'+val('f-d2');
  else if(cat==='done') detail='配達完了';
  else if(cat==='other') detail=val('f-d1');
  let photoThumb='', photoId='';
  if(state.pendingPhoto){
    try{ photoId=await store.addImage(state.pendingPhoto.full);
      photoThumb=state.pendingPhoto.thumb; }
    catch(err){ toast('画像の送信に失敗しました：'+(err.message||'')); return; }
  }
  store.addReport({ ts:Date.now(), author:state.user.name, route:val('f-route'),
    cat, customer, detail, memo, photoThumb, photoId,
    needsAction:cat!=='done', done:false, doneBy:'', doneAt:0 });
  toast('報告を送信しました ✓');
  state.pendingPhoto=null;
  state.composeCat=null; $('#report-form').hidden=true; buildCatGrid();
  showView('timeline');
}

/* ---------------- 画面切り替え ---------------- */
function showView(name){
  ['timeline','compose','todo','shift','timecard'].forEach(v=>$('#view-'+v).hidden=(v!==name));
  $$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===name));
  if(name==='timeline' && !state.fSearch && state.fRoute==='all' && state.fCat==='all')
    requestAnimationFrame(()=>window.scrollTo(0,document.body.scrollHeight));
  else window.scrollTo(0,0);
  if(name==='shift') renderShift();
  if(name==='todo') renderTodo();
  if(name==='timecard') renderTimecard();
}

/* ---------------- データ更新コールバック ---------------- */
function reportsUpdated(list){
  state.reports=[...list].sort((a,b)=>a.ts-b.ts);
  if(state.user){ renderTimeline(); renderTodo(); updateBadge(); }
}
function shiftsUpdated(map){ state.shifts=map;
  if(state.user && !$('#view-shift').hidden) renderShift(); }
function timecardsUpdated(map){ state.timecards=map;
  if(state.user && !$('#view-timecard').hidden) renderTimecard(); }
function commentsUpdated(map){ state.comments=map;
  if(state.user && !$('#view-timeline').hidden) renderTimeline(); }
function announcementsUpdated(list){ state.announcements=[...list].sort((a,b)=>a.ts-b.ts);
  if(state.user && !$('#view-timeline').hidden) renderTimeline(); }

/* ---------------- ログイン ---------------- */
function segInit(id){
  const seg=document.getElementById(id);
  seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    seg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); });
}
const segVal = id => document.querySelector('#'+id+' button.on').dataset.v;

function showApp(){
  $('#login').hidden=true; $('#app').hidden=false;
  $('#btn-user').textContent='👤 '+state.user.name+(isAdmin()?'（管理者）':'');
  $('#mode-badge').textContent = MODE==='online' ? 'オンライン' : 'デモ体験版';
  $('#shift-mode').hidden=!isAdmin();
  state.shiftMode='edit'; state.shiftSelPeriod=null; state.selDate=null;
  $$('#shift-mode button').forEach(b=>b.classList.toggle('on',b.dataset.v==='edit'));
  state.tcMode='me'; state.tcPeriod=initTcPeriod();
  $$('#tc-mode button').forEach(b=>b.classList.toggle('on',b.dataset.v==='me'));
  $('#todo-note').textContent = isAdmin()
    ? '配達完了以外の報告は自動でここに入ります。エクセルに反映したら「済」を押してください。'
    : '配達完了以外の報告は自動でここに入ります。「済」の処理（消し込み）は管理者が行います。';
  state.fSearch=''; state.fPerson='all'; state.fDate=''; state.fRoute='all'; state.fCat='all'; state.openComments=null;
  $('#search-input').value=''; $('#search-wrap').classList.remove('active'); $('#adv-panel').hidden=true;
  buildFilterChips(); buildCatGrid();
  $('#todo-seg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    $('#todo-seg').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); state.todoTab=b.dataset.v; renderTodo(); });
  renderTimeline(); renderTodo(); updateBadge();
}

function init(){
  segInit('login-role'); segInit('login-route');
  $('#mode-note').textContent = MODE==='online'
    ? 'オンライン版：報告はメンバー全員にリアルタイムで共有されます。'
    : '※いまはデモ体験版です。データはこの端末の中だけで、他の人には共有されません。';
  if(MODE==='demo') $('#mode-note').textContent += '（新規登録してお試しください。デモ版の管理者コードは 1234）';
  // ログイン／新規登録タブ
  const loginTab = () => segVal('login-tab');
  const refreshLoginUI = () => {
    const reg = loginTab()==='register';
    $('#reg-wrap').hidden = !reg;
    $('#admin-pin-wrap').hidden = !(reg && segVal('login-role')==='admin');
    $('#login-go').textContent = reg ? '登録してはじめる' : 'ログイン';
  };
  segInit('login-tab');
  $$('#login-tab button').forEach(b=>b.addEventListener('click',refreshLoginUI));
  $$('#login-role button').forEach(b=>b.addEventListener('click',refreshLoginUI));
  // 保存されたログイン状態があれば復元
  const saved=safeStorage.get('mgk_user');
  if(saved){ try{ state.user=JSON.parse(saved); }catch(e){} }
  if(state.user && state.user.route==='他') state.user.route='厨房';
  if(state.user && state.user.auth && state.user.name){
    $('#login-name').value=state.user.name; showApp();
  }else{
    state.user=null;   // 旧形式の保存データは無効化（アカウント登録が必要）
  }
  $('#login-go').onclick=async ()=>{
    const name=$('#login-name').value.trim();
    const pin=$('#login-pw').value.trim();
    if(!name){ toast('お名前を入力してください'); return; }
    if(!/^\d{4,8}$/.test(pin)){ toast('暗証番号は4〜8桁の数字にしてください'); return; }
    const route=segVal('login-route');
    try{
      if(loginTab()==='register'){
        const role=segVal('login-role');
        if(role==='admin' && $('#login-pin').value!==ADMIN_CODE){
          toast('管理者コードが違います'); return;
        }
        await store.createAccount({ name, pinHash:hashPin(name,pin), role, createdAt:Date.now() });
        state.user={ name, role, route, auth:true };
        toast('登録しました。ようこそ！');
      }else{
        const acc=await store.getAccount(name);
        if(!acc){ toast('この名前の登録がありません。「新規登録」からどうぞ'); return; }
        if(acc.pinHash!==hashPin(name,pin)){ toast('暗証番号が違います'); return; }
        state.user={ name, role:acc.role, route, auth:true };
      }
      safeStorage.set('mgk_user', JSON.stringify(state.user));
      $('#login-pw').value='';
      showApp();
    }catch(e){ toast(e.message||'エラーが発生しました'); }
  };
  $('#btn-user').onclick=()=>{
    state.user=null; safeStorage.del('mgk_user');
    $('#app').hidden=true; $('#login').hidden=false;
    toast('ログアウトしました。ログインし直してください');
  };
  // アプリ起動と同時にデータ接続（ログイン前でも接続だけ済ませておく）
  store.init(reportsUpdated, shiftsUpdated, timecardsUpdated, commentsUpdated, announcementsUpdated)
    .catch(e=>toast('接続エラー：'+e.message));
  $$('nav button').forEach(b=>b.onclick=()=>showView(b.dataset.view));
  // 検索
  const doSearch=()=>{ state.fSearch=$('#search-input').value;
    $('#search-wrap').classList.toggle('active', !!state.fSearch); renderTimeline(); };
  $('#search-input').oninput=doSearch;
  $('#search-clear').onclick=()=>{ $('#search-input').value=''; state.fSearch='';
    $('#search-wrap').classList.remove('active'); renderTimeline(); $('#search-input').focus(); };
  // 詳しく絞り込む（報告した人・日付）
  $('#adv-btn').onclick=()=>{ const p=$('#adv-panel'); p.hidden=!p.hidden; };
  $('#f-person').onchange=()=>{ state.fPerson=$('#f-person').value; renderTimeline(); };
  $('#f-date-input').onchange=()=>{ state.fDate=$('#f-date-input').value; renderTimeline(); };
  $$('#adv-panel .adv-date .chip').forEach(b=>b.onclick=()=>{
    const d=new Date(); if(b.dataset.quick==='yesterday') d.setDate(d.getDate()-1);
    state.fDate=dateKey(d.getTime()); renderTimeline(); });
  $('#adv-clear').onclick=()=>{ state.fPerson='all'; state.fDate=''; renderTimeline(); };
  // タイムカード
  $$('#tc-mode button').forEach(b=>b.onclick=()=>{
    $$('#tc-mode button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); state.tcMode=b.dataset.v; renderTimecard(); });
  $('#tc-prev').onclick=()=>{ const p=state.tcPeriod; p.m--; if(p.m<0){p.m=11;p.y--;} renderTimecard(); };
  $('#tc-next').onclick=()=>{ const p=state.tcPeriod; p.m++; if(p.m>11){p.m=0;p.y++;} renderTimecard(); };
  $('#tc-today').onclick=()=>{ state.tcPeriod=initTcPeriod(); renderTimecard(); };
  $('#cal-prev').onclick=()=>{ const p=state.period; p.m--; if(p.m<0){p.m=11;p.y--;}
    state.selDate=null; renderShift(); };
  $('#cal-next').onclick=()=>{ const p=state.period; p.m++; if(p.m>11){p.m=0;p.y++;}
    state.selDate=null; renderShift(); };
  $('#btn-cal-today').onclick=()=>{ state.period=initPeriod(); state.selDate=null; renderShift(); };
  $('#btn-shift-send').onclick=sendShift;
  $$('#shift-mode button').forEach(b=>b.onclick=()=>{
    $$('#shift-mode button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); state.shiftMode=b.dataset.v; state.selDate=null; renderShift(); });
  $('#report-form').onsubmit=submitReport;
  $('#btn-back-cat').onclick=()=>{ state.composeCat=null; state.pendingPhoto=null;
    $('#report-form').hidden=true; buildCatGrid(); };
  $('#photo-viewer').onclick=()=>{ $('#photo-viewer').hidden=true; };
}
init();
</script>
</body>
