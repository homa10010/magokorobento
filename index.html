<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23395B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="まごころ弁当">
<title>まごころ弁当</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- アイコン（インラインSVG） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ic-talk" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.5 4v-4h0A2.5 2.5 0 0 1 4 13.5z"/></symbol>
  <symbol id="ic-shift" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8.5 14.5l2.2 2.2 4.3-4.4"/></symbol>
  <symbol id="ic-report" viewBox="0 0 24 24"><path d="M8 4h8M9 2.5h6v3H9zM6.5 4.5H6A2 2 0 0 0 4 6.5v13A2 2 0 0 0 6 21.5h12a2 2 0 0 0 2-2v-13a2 2 0 0 0-2-2h-.5"/><path d="M8 11h8M8 15h5"/></symbol>
  <symbol id="ic-todo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.8 2.8L16.3 9.5"/></symbol>
  <symbol id="ic-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></symbol>
  <symbol id="ic-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="ic-send" viewBox="0 0 24 24"><path d="M5 12l14-7-5 14-2.5-5.5z"/></symbol>
  <symbol id="ic-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17.5l5-4.5 4 3.5 3-2.5 4 3.5"/></symbol>
  <symbol id="ic-file" viewBox="0 0 24 24"><path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="ic-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="ic-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="ic-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></symbol>
  <symbol id="ic-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15zM10 20.5a2 2 0 0 0 4 0"/></symbol>
  <symbol id="ic-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="ic-users" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M16 5.5a3 3 0 0 1 0 6M18 14.8c1.8.7 3 2.4 3 5.2"/></symbol>
  <symbol id="ic-down" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
</svg>

<!-- ========== ログイン ========== -->
<div id="login">
  <div class="login-card">
    <h1>まごころ弁当</h1>
    <p class="sub">チャットとシフトを、ここひとつで</p>
    <div class="seg" id="login-tab" style="margin-top:16px">
      <button type="button" data-v="login" class="on">ログイン</button>
      <button type="button" data-v="register">新規登録</button>
    </div>
    <label for="login-name">お名前</label>
    <input id="login-name" maxlength="12" autocomplete="off">
    <label for="login-pw">暗証番号（4〜8桁の数字）</label>
    <input id="login-pw" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    <div id="reg-wrap" hidden>
      <label for="login-pin">管理者コード</label>
      <input id="login-pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
      <p class="note" style="margin-top:6px">最初の管理者を登録するときだけ使います。スタッフは管理者が追加します。</p>
    </div>
    <label>今日の担当（報告に使います）</label>
    <div class="seg" id="login-route">
      <button type="button" data-v="1" class="on">1</button>
      <button type="button" data-v="2">2</button>
      <button type="button" data-v="3">3</button>
      <button type="button" data-v="4">4</button>
      <button type="button" data-v="厨房">厨房</button>
    </div>
    <button id="login-go" class="primary">ログイン</button>
    <p id="mode-note" class="note"></p>
  </div>
</div>

<!-- ========== アプリ本体 ========== -->
<div id="app" hidden>
  <header>
    <div class="h-title">まごころ弁当 <span id="mode-badge"></span></div>
    <button id="btn-user" title="ログアウト"></button>
  </header>
  <main>

    <!-- トーク -->
    <section id="view-chat" class="view" hidden>
      <div id="chat-list-wrap">
        <h2>トーク</h2>
        <div id="notify-bar" hidden>
          <svg class="i"><use href="#ic-bell"/></svg>
          <span>新しいメッセージをお知らせします</span>
          <button id="notify-on">通知をオンにする</button>
        </div>
        <div id="chat-list"></div>
      </div>
      <div id="chat-thread-wrap" hidden>
        <div class="thread-head">
          <button id="chat-back" class="icon-btn" aria-label="トーク一覧に戻る"><svg class="i"><use href="#ic-back"/></svg></button>
          <h2 id="chat-title"></h2>
          <span style="width:40px"></span>
        </div>
        <div id="chat-msgs"></div>
        <div class="chat-input">
          <button id="chat-attach" class="icon-btn" aria-label="写真・ファイルを追加"><svg class="i"><use href="#ic-plus"/></svg></button>
          <textarea id="chat-text" rows="1" placeholder="メッセージ" maxlength="500" aria-label="メッセージ"></textarea>
          <button id="chat-send" aria-label="送信" disabled><svg class="i"><use href="#ic-send"/></svg></button>
        </div>
        <input type="file" id="chat-photo" accept="image/*" hidden>
        <input type="file" id="chat-file" hidden>
      </div>
    </section>

    <!-- シフト -->
    <section id="view-shift" class="view" hidden>
      <h2>シフト</h2>
      <div class="seg" id="shift-top" style="margin-bottom:12px">
        <button data-v="confirmed" class="on">確定シフト</button>
        <button data-v="avail">希望提出</button>
      </div>

      <div id="pane-confirmed">
        <div class="seg" id="cs-mode" style="margin-bottom:10px">
          <button data-v="me" class="on">自分</button>
          <button data-v="day">日ごと</button>
          <button data-v="person">人ごと</button>
        </div>
        <div class="period-bar">
          <button id="cs-prev" aria-label="前の期間"><svg class="i"><use href="#ic-back"/></svg></button>
          <div id="cs-label" class="cal-label"></div>
          <button id="cs-next" aria-label="次の期間"><svg class="i"><use href="#ic-next"/></svg></button>
        </div>
        <button id="cs-today" class="today-btn">今の期間に戻る</button>
        <div id="cs-body"></div>
      </div>

      <div id="pane-avail" hidden>
        <!-- 仮仕様: 希望提出は既存機能のまま残す（管理者に「このアプリでも必要か」要確認） -->
        <div class="seg" id="shift-mode" hidden style="margin-bottom:10px">
          <button data-v="edit" class="on">自分の提出</button>
          <button data-v="view">みんなの提出を見る</button>
        </div>
        <div class="cal-head">
          <button id="cal-prev" aria-label="前の期間"><svg class="i"><use href="#ic-back"/></svg></button>
          <div id="cal-label" class="cal-label"></div>
          <button id="cal-next" aria-label="次の期間"><svg class="i"><use href="#ic-next"/></svg></button>
        </div>
        <button id="btn-cal-today" class="today-btn">今の期間に戻る</button>
        <div id="deadline-note" class="deadline"></div>
        <p class="note" id="shift-help"></p>
        <div id="cal-container"></div>
        <div id="shift-submit-bar">
          <div id="shift-sel-count" class="note" style="text-align:center;margin-top:10px"></div>
          <button id="btn-shift-send" class="primary" style="margin-top:8px">希望を送信</button>
        </div>
      </div>
    </section>

    <!-- 報告（タイムライン） -->
    <section id="view-timeline" class="view">
      <div class="filters">
        <div class="search-wrap" id="search-wrap">
          <span class="s-ico"><svg class="i"><use href="#ic-search"/></svg></span>
          <input id="search-input" type="search" placeholder="お客様名・内容・名前で検索" autocomplete="off" aria-label="報告を検索">
          <button class="s-clear" id="search-clear" aria-label="検索をクリア">✕</button>
        </div>
        <div class="chips" id="chips-route"></div>
        <div class="chips" id="chips-cat"></div>
        <div class="adv-bar">
          <button id="adv-btn">詳しく絞り込む ▾</button>
          <button id="adv-clear" hidden>絞り込みを解除</button>
        </div>
        <div id="adv-panel" hidden>
          <div class="adv-row">
            <label for="f-person">報告した人</label>
            <select id="f-person"></select>
          </div>
          <div class="adv-row">
            <label>日付でしぼる</label>
            <div class="adv-date">
              <button type="button" class="chip" data-quick="today">今日</button>
              <button type="button" class="chip" data-quick="yesterday">昨日</button>
              <input type="date" id="f-date-input" aria-label="日付">
            </div>
          </div>
        </div>
      </div>
      <div id="search-count" class="search-count" hidden></div>
      <div id="timeline" class="timeline"></div>
      <button class="fab" id="btn-new-report"><svg class="i"><use href="#ic-plus"/></svg>報告する</button>
    </section>

    <section id="view-compose" class="view" hidden>
      <div class="sub-head">
        <button id="compose-back" class="icon-btn" aria-label="報告一覧に戻る"><svg class="i"><use href="#ic-back"/></svg></button>
        <h2>報告を送る</h2>
      </div>
      <p class="note" style="margin-bottom:10px">種類を選ぶと入力フォームが開きます</p>
      <div class="cat-grid" id="cat-grid"></div>
      <form id="report-form" hidden>
        <div class="form-cat-head"><span id="form-cat-label"></span>
          <button type="button" id="btn-back-cat">種類を選び直す</button></div>
        <div id="form-fields"></div>
        <p class="note" style="margin-top:14px" id="form-action-note"></p>
        <button class="primary" type="submit">報告を送信</button>
      </form>
    </section>

    <section id="view-todo" class="view" hidden>
      <h2>要対応リスト</h2>
      <p class="note" style="margin-bottom:10px" id="todo-note"></p>
      <div class="seg" id="todo-seg" style="margin-bottom:12px">
        <button data-v="open" class="on">未処理</button>
        <button data-v="done">処理済み</button>
      </div>
      <div id="todo-list"></div>
    </section>

    <section id="view-timecard" class="view" hidden>
      <div class="sub-head">
        <h2>勤怠</h2>
      </div>
      <div class="seg" id="tc-mode" hidden style="margin-bottom:10px">
        <button data-v="me" class="on">自分の打刻</button>
        <button data-v="all">みんなの勤怠</button>
      </div>
      <button class="menu-item" data-go="members" id="menu-members" hidden style="margin-bottom:12px"><span class="mi"><svg class="i"><use href="#ic-users"/></svg></span>メンバー管理（管理者）<span class="chev"><svg class="i"><use href="#ic-next"/></svg></span></button>
      <div id="tc-me"></div>
      <div id="tc-all" hidden>
        <div class="cal-head">
          <button id="tc-prev" aria-label="前の期間"><svg class="i"><use href="#ic-back"/></svg></button>
          <div id="tc-label" class="cal-label"></div>
          <button id="tc-next" aria-label="次の期間"><svg class="i"><use href="#ic-next"/></svg></button>
        </div>
        <button id="tc-today" class="today-btn">今の期間に戻る</button>
        <div id="tc-all-body"></div>
      </div>
    </section>

    <section id="view-members" class="view" hidden>
      <div class="sub-head">
        <button class="icon-btn" data-go="timecard" aria-label="勤怠に戻る"><svg class="i"><use href="#ic-back"/></svg></button>
        <h2>メンバー管理</h2>
      </div>
      <!-- 仮仕様: 退職者を削除しても過去のメッセージ・報告は残す（管理者に要確認） -->
      <div class="add-card">
        <label for="mem-name">お名前</label>
        <input id="mem-name" maxlength="12" autocomplete="off">
        <label for="mem-pin">最初の暗証番号（4〜8桁の数字）</label>
        <input id="mem-pin" inputmode="numeric" maxlength="8" autocomplete="off">
        <label>役割</label>
        <div class="seg" id="mem-role">
          <button type="button" data-v="staff" class="on">スタッフ</button>
          <button type="button" data-v="admin">管理者</button>
        </div>
        <button id="mem-add" class="primary">メンバーを追加</button>
      </div>
      <p class="note" style="margin-bottom:8px">削除しても、過去のメッセージと報告は残ります。</p>
      <div id="mem-list"></div>
    </section>

  </main>
  <nav>
    <button data-view="timeline" class="on"><svg class="i"><use href="#ic-report"/></svg>報告</button>
    <button data-view="chat"><svg class="i"><use href="#ic-talk"/></svg>チャット<span class="nav-badge" id="chat-badge" hidden></span></button>
    <button data-view="todo" id="nav-todo" hidden><svg class="i"><use href="#ic-todo"/></svg>要対応<span class="nav-badge" id="todo-badge" hidden></span></button>
    <button data-view="shift"><svg class="i"><use href="#ic-shift"/></svg>シフト</button>
    <button data-view="timecard"><svg class="i"><use href="#ic-clock"/></svg>勤怠</button>
  </nav>
</div>

<div id="attach-menu" class="attach-menu" hidden>
  <button id="attach-photo"><svg class="i"><use href="#ic-image"/></svg>写真を送る</button>
  <button id="attach-file"><svg class="i"><use href="#ic-file"/></svg>ファイルを送る</button>
</div>
<div id="sheet-host"></div>
<div id="photo-viewer" hidden><img alt="写真"><div class="close-hint">タップで閉じる</div></div>
<div id="toast" role="status" aria-live="polite"></div>

<!-- Firebaseの設定と管理者コードは config.js に書きます（index.html を差し替えても設定が消えません）。
     config.js が無い／未設定のとき、または ?demo を付けて開いたときは「デモ体験版」で動きます。 -->
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
